<!DOCTYPE html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>秘書検定準1級クイズ</title>
<style>
body{font-family:Yu Gothic,sans-serif;background:linear-gradient(135deg,#ffd9ec,#d8f1ff);padding:20px}
.card{max-width:900px;margin:auto;background:#fff;border-radius:28px;padding:24px}
.btn{display:block;width:100%;margin:8px 0;padding:14px;border:none;border-radius:16px;background:#f5f0ff;text-align:left}
#next{display:none}
</style></head><body><div class='card'><h1>🐰秘書検定準1級クイズ</h1><div id='q'></div><div id='r'></div><div id='e'></div><button id='next'>次へ</button></div>
<script>
const qs=[{"type": "不適当なもの", "q": "上司から取引先へのお礼状の下書きを渡されました。内容を確認すると、事実関係に誤りがある可能性に気付きました。秘書の対応として、不適当なものはどれですか。", "c": ["誤りと思われる箇所を確認してから清書する", "上司に確認し、事実関係を再確認する", "誤りの可能性を伝えた上で判断を仰ぐ", "秘書の判断で内容を修正して清書する"], "a": 3, "e": "事実関係の修正は上司の確認を得る必要があります。"}, {"type": "最も適当なもの", "q": "上司が出張中、重要取引先から面会依頼が入りました。帰社日程は確定していません。最も適当な対応はどれですか。", "c": ["帰社するまで待っていただく", "面会は難しいと伝える", "日程が未定であることを説明し、先方の希望を確認する", "秘書の判断で面会日時を決定する"], "a": 2, "e": "現状を説明し、相手の希望を確認しながら調整するのが適切です。"}, {"type": "不適当なもの", "q": "後輩秘書が取引先への連絡を忘れていたことが分かりました。指導係として不適当なものはどれですか。", "c": ["忘れた原因を一緒に確認する", "再発防止策を考えさせる", "相手への対応を優先する", "本人に知らせず自分だけで処理する"], "a": 3, "e": "本人の成長につながらず、再発防止にもなりません。"}, {"type": "最も適当なもの", "q": "会議中の上司に『至急』と言われる電話が入りました。最も適当な対応はどれですか。", "c": ["直ちに会議室へ取り次ぐ", "原則どおり取り次がない", "用件と緊急性を確認した上で判断する", "折り返しを依頼する"], "a": 2, "e": "原則だけでなく状況判断が求められます。"}, {"type": "不適当なもの", "q": "上司のスピーチ原稿を清書する際の対応として、不適当なものはどれですか。", "c": ["読みづらい箇所を確認する", "分量について相談する", "修正案を提案する", "内容を大幅に書き換えてから報告する"], "a": 3, "e": "内容の大幅変更を独断で行うのは不適切です。"}, {"type": "最も適当なもの", "q": "来客予定時刻の直前に上司から『10分ほど遅れる』と連絡がありました。最も適当な対応はどれですか。", "c": ["来客に事情を説明し意向を確認する", "上司が来るまで説明しない", "面談の中止を伝える", "秘書が代わりに面談する"], "a": 0, "e": "まず事情を説明し、来客への配慮を行います。"}];
let i=0,s=0;
function show(){
 let x=qs[i];
 q.innerHTML=`<h3>${i+1}/${qs.length}</h3><p><b>${x.type}</b>を選びなさい</p><p>${x.q}</p>`+x.c.map((c,n)=>`<button class="btn" onclick="ans(${n})">${String.fromCharCode(65+n)}. ${c}</button>`).join('');
 r.innerHTML='';e.innerHTML='';next.style.display='none';
}
function ans(n){
 let x=qs[i];
 document.querySelectorAll('.btn').forEach(b=>b.disabled=true);
 if(n===x.a){s++;r.innerHTML='💮 正解！';} else r.innerHTML='😢 残念！';
 e.innerHTML='<b>解説</b><br>'+x.e; next.style.display='inline-block';
}
next.onclick=()=>{i++; if(i<qs.length)show(); else q.innerHTML=`<h2>終了</h2><h3>${s} / ${qs.length}点</h3>`;}
show();
</script></body></html>
